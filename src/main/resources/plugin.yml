name: MVillageNamer
version: 1.4.0
main: gay.viktoria.mvillagenamer.VillageNamerPlugin
description: A plugin to automatically assign names to villagers.
author: Maria Taylor
website: https://viktoria.gay
api-version: '26.1.2'

commands:
  namechunk:
    description: Assigns names to unnamed villagers in the chunk of the executor.
    usage: /namechunk
    permission: villagenamer.namechunk
  renametag:
    description: Gives the player a name tag with the custom name "RENAMEME" to application in renaming.
    usage: /renametag
    permission: villagenamer.renametag